- name: Download specific files and update website
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python -c "
          import os, json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          ALLOWED_FILES = {'MATH2103.pdf', 'MATH2108.pdf'}
          
          MODULE_TITLES = {
              'MATH2103.pdf': 'MATH2103: Algebra and Number Theory',
              'MATH2108.pdf': 'MATH2108: Statistics'
          }

          try:
              creds_dict = json.loads(os.environ['GCP_SA_KEY'])
              creds = service_account.Credentials.from_service_account_info(
                  creds_dict, scopes=['https://www.googleapis.com/auth/drive.readonly']
              )
              service = build('drive', 'v3', credentials=creds)

              folder_id = os.environ['GDRIVE_FOLDER_ID']
              query_str = f\"'{folder_id}' in parents and trashed=false\"
              
              results = service.files().list(
                  q=query_str,
                  pageSize=100, fields='files(id, name, mimeType)'
              ).execute()
              items = results.get('files', [])

              os.makedirs('notes', exist_ok=True)
              downloaded_files = []

              for item in items:
                  file_id = item['id']
                  file_name = item['name']

                  if file_name not in ALLOWED_FILES:
                      continue

                  print(f'Downloading: {file_name}')
                  request = service.files().get_media(fileId=file_id)
                  fh = open(os.path.join('notes', file_name), 'wb')
                  downloader = MediaIoBaseDownload(fh, request)
                  done = False
                  while not done:
                      _, done = downloader.next_chunk()
                  fh.close()
                  downloaded_files.append(file_name)

              # Generate the HTML for the PDFs
              downloaded_files.sort()
              modules_html = ''
              for pdf in downloaded_files:
                  title = MODULE_TITLES.get(pdf, pdf)
                  modules_html += f'''
                  <div class=\"module-header\">
                      <h3>{title}</h3>
                      <a href=\"notes/{pdf}\" target=\"_blank\" class=\"open-link\">Open PDF ↗</a>
                  </div>
                  <iframe src=\"notes/{pdf}\"></iframe>
                  '''

              # Inject into the template
              with open('notes-template.html', 'r', encoding='utf-8') as f:
                  template = f.read()

              final_html = template.replace('<!-- NOTES_CONTENT -->', modules_html)

              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(final_html)
              
              print('Successfully generated index.html from notes-template.html')

          except Exception as e:
              print(f'Error during Google Drive sync: {e}')
              exit(1)
          "
