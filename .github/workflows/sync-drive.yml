name: Sync Google Drive Notes

on:
  schedule:
    - cron: '0 4 * * *' # Runs every day at 4:00 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main # Runs automatically when you edit the template

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest remote changes
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git pull --rebase origin main || git pull --rebase origin master || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Download specific files and update website
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python -c "
          import os, json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          ALLOWED_FILES = {'MATH2103.pdf', 'MATH2108.pdf'}
          
          MODULE_TITLES = {
              'MATH2103.pdf': 'MATH2103: Algebra and Number Theory',
              'MATH2108.pdf': 'MATH2108: Statistics'
          }

          try:
              creds_dict = json.loads(os.environ['GCP_SA_KEY'])
              creds = service_account.Credentials.from_service_account_info(
                  creds_dict, scopes=['https://www.googleapis.com/auth/drive.readonly']
              )
              service = build('drive', 'v3', credentials=creds)

              folder_id = os.environ['GDRIVE_FOLDER_ID']
              query_str = f\"'{folder_id}' in parents and trashed=false\"
              
              results = service.files().list(
                  q=query_str,
                  pageSize=100, fields='files(id, name, mimeType)'
              ).execute()
              items = results.get('files', [])

              os.makedirs('notes', exist_ok=True)
              downloaded_files = []

              for item in items:
                  file_id = item['id']
                  file_name = item['name']

                  if file_name not in ALLOWED_FILES:
                      continue

                  print(f'Downloading: {file_name}')
                  request = service.files().get_media(fileId=file_id)
                  fh = open(os.path.join('notes', file_name), 'wb')
                  downloader = MediaIoBaseDownload(fh, request)
                  done = False
                  while not done:
                      _, done = downloader.next_chunk()
                  fh.close()
                  downloaded_files.append(file_name)

              # Generate the HTML for the PDFs
              downloaded_files.sort()
              modules_html = ''
              for pdf in downloaded_files:
                  title = MODULE_TITLES.get(pdf, pdf)
                  modules_html += f'''
                  <div class=\"module-header\">
                      <h3>{title}</h3>
                      <a href=\"notes/{pdf}\" target=\"_blank\" class=\"open-link\">Open PDF ↗</a>
                  </div>
                  <iframe src=\"notes/{pdf}\"></iframe>
                  '''

              # Inject into the template
              with open('notes-template.html', 'r', encoding='utf-8') as f:
                  template = f.read()

              final_html = template.replace('<!-- NOTES_CONTENT -->', modules_html)

              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(final_html)
              
              print('Successfully generated index.html from notes-template.html')

          except Exception as e:
              print(f'Error during Google Drive sync: {e}')
              exit(1)
          "

      - name: Commit and push changes
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
          
          git add notes/ index.html
          
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Auto-sync MATH2103 and MATH2108 notes"
            git push
          fi
